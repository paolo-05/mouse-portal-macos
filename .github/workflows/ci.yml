name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Swift package tests
        run: make test
      - name: Xcode build
        run: make xcode-build
      - name: Xcode tests
        run: make xcode-test
      - name: Package app
        run: make app
