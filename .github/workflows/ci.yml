name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Swift package tests
        run: make test
      - name: Xcode build
        run: make xcode-build
      - name: Xcode tests
        run: make xcode-test
      - name: Package app
        run: make app
      - name: Validate Homebrew Cask
        run: |
          ruby -c Casks/mouseportal.rb
          ruby -c scripts/update-cask.rb
          cp Casks/mouseportal.rb "${RUNNER_TEMP}/mouseportal.rb"
          ruby scripts/update-cask.rb 9.8.7 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa "${RUNNER_TEMP}/mouseportal.rb"
          grep -F 'version "9.8.7"' "${RUNNER_TEMP}/mouseportal.rb"
          grep -F 'sha256 "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' "${RUNNER_TEMP}/mouseportal.rb"
